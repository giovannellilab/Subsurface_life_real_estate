[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subsurface-life-real-estate"
version = "0.1.0"
description = "A framework linking microbial cell geometry to subsurface pore and fracture geometry."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=2", "scipy>=1.14", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]
